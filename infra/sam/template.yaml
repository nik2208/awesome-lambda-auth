AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

# awesome-lambda-auth — quickstart stack
# =====================================
#
# One HTTP API (payload format 2.0), one Lambda running the whole auth router,
# one DynamoDB single table, one generated signing secret holding both HS256
# keys. Nothing else.
#
# ---------------------------------------------------------------------------
# KNOWN LIMITATION: cookie mode needs a custom domain
# ---------------------------------------------------------------------------
# On a raw execute-api URL the service cannot issue hardened cookies, and the
# runtime will REFUSE TO START in cookie mode unless you say so explicitly.
# Two separate problems, both real:
#
#   1. The stage path is not "/". A named stage serves the API at
#      https://<id>.execute-api.<region>.amazonaws.com/<stage>/..., so the
#      browser sees a stage segment the router does not. The `__Host-` prefix
#      requires Path=/ and no Domain, and the Path-scoped refresh cookie
#      (cookies.refreshTokenPath, derived as <apiPrefix>/refresh) no longer
#      matches the URL the browser actually requests. See the note on
#      lambdahttp.Options.StagePrefix in internal/lambdahttp/lambdahttp.go:85-94:
#      stripping the stage server-side fixes routing and does nothing for the
#      browser. This template defaults StageName to "$default", which serves at
#      the domain root and removes this half of the problem; a named stage
#      brings it back, and the template then compensates by prefixing
#      AWESOME_AUTH_COOKIES_REFRESH_PATH with the stage.
#
#   2. execute-api.amazonaws.com is a shared registrable domain. Every other
#      AWS account's API lives under it, so cookie scoping and the CSRF
#      double-submit no longer rest on a host you control. "$default" does not
#      fix this and nothing except a custom domain will.
#
# The governing knob is `cookies.allowInsecureCookieMode`
# (AWESOME_AUTH_COOKIES_ALLOW_INSECURE_COOKIE_MODE), spec config-schema.md
# §1.2, enforced by refuse-to-start rule RS-2 (§2, internal/config/rules.go
# checkRS2InsecureCookieMode). It defaults to "true" here so the quickstart
# boots; for anything real, set PublicUrl to a custom domain and flip it to
# "false". Bearer clients (X-Auth-Strategy: bearer) are unaffected either way.
# ---------------------------------------------------------------------------

Description: >-
  awesome-lambda-auth quickstart: HTTP API + one Lambda auth router + a
  DynamoDB single table. Self-hosted authentication in your own account.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: Deployment}
        Parameters: [DeploymentEnvironment, StageName, PublicUrl, ApiPrefix]
      - Label: {default: Browser-facing behaviour}
        Parameters: [AllowedOrigins, CookieDomain, CookieSameSite, AllowInsecureCookieMode]
      - Label: {default: Signing secrets}
        Parameters: [JwtAccessSecretArn, JwtRefreshSecretArn]
      - Label: {default: Storage}
        Parameters: [TableNamePrefix, MaxReadRequestUnits, MaxWriteRequestUnits, EnableDeletionProtection]
      - Label: {default: Function}
        Parameters: [MemorySize, Timeout, LogRetentionDays, SessionCheckOn]

Parameters:

  DeploymentEnvironment:
    Type: String
    Default: development
    AllowedValues: [development, production]
    Description: >-
      AWESOME_AUTH_DEPLOYMENT_ENVIRONMENT. "production" turns on the strict
      refuse-to-start rules (config-schema.md §2). The quickstart defaults to
      development because it runs on a shared AWS domain.

  StageName:
    Type: String
    Default: '$default'
    AllowedPattern: '^(\$default|[A-Za-z0-9_-]{1,128})$'
    Description: >-
      HTTP API stage. "$default" serves at the domain root, which is what keeps
      cookie Path scoping working (see the header comment). A named stage adds
      a /<stage> segment to every URL.

  PublicUrl:
    Type: String
    Default: ''
    Description: >-
      AWESOME_AUTH_DEPLOYMENT_PUBLIC_URL — the origin clients actually reach,
      e.g. https://auth.example.com. Empty leaves the variable unset, which is
      correct on a raw execute-api URL: the value's only consumer is RS-2, and
      RS-2 can only be satisfied on this stack's own domain by
      AllowInsecureCookieMode=true, which skips the check. See the note on the
      variable itself — defaulting it to the stack's own URL is a circular
      dependency. A custom domain here is the only way to run cookie mode with
      AllowInsecureCookieMode=false. Placeholder default is deliberately empty;
      never commit a real domain.

  ApiPrefix:
    Type: String
    Default: /auth
    AllowedPattern: '^/[A-Za-z0-9._~/-]*$'
    Description: AWESOME_AUTH_HTTP_API_PREFIX. Path the auth routes mount under.

  AllowedOrigins:
    Type: String
    Default: ''
    Description: >-
      AWESOME_AUTH_CORS_ORIGINS — comma-separated absolute origins, e.g.
      https://app.example.com. Empty means no CORS middleware at all, which is
      correct for same-origin and bearer-only clients. CORS is handled by the
      function, not by API Gateway, so there is exactly one place it is
      configured.

  CookieDomain:
    Type: String
    Default: ''
    Description: >-
      AWESOME_AUTH_COOKIES_DOMAIN. Empty means host-only cookies, which is the
      safer default; setting it forfeits the __Host- prefix. Placeholder is
      empty on purpose.

  CookieSameSite:
    Type: String
    Default: lax
    AllowedValues: [strict, lax, none]
    Description: AWESOME_AUTH_COOKIES_SAMESITE. "none" requires Secure, which this stack always sets.

  AllowInsecureCookieMode:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      AWESOME_AUTH_COOKIES_ALLOW_INSECURE_COOKIE_MODE. See the header comment.
      "true" is what lets a stack on a raw execute-api URL start at all. Set a
      custom domain in PublicUrl and change this to "false" before you put real
      users behind it.

  # -----------------------------------------------------------------------
  # Signing secrets: bring your own, or let the stack generate them.
  #
  # These parameters carry an ARN — a *reference*, never a value. Nothing about
  # a signing secret ever passes through a template parameter, a --parameter
  # override, a shell history or a CloudFormation event: leave them empty and
  # the stack generates the secrets with GenerateSecretString, which is the
  # default path and the one no human hand ever touches.
  #
  # Left empty, BOTH knobs end up pointing at the same generated secret with
  # different '#<jsonKey>' selectors, so cold start pays for one
  # GetSecretValue instead of two — see the JwtSigningSecrets resource.
  #
  # Deliberately NOT NoEcho. NoEcho is for values that must not be echoed, and
  # an ARN is the opposite: it is published in the function's environment on
  # purpose, so that `lambda:GetFunction` reveals a pointer instead of a key.
  # Marking it NoEcho would hide it from describe-stacks, where an operator
  # legitimately needs to read it, and would protect nothing.
  #
  # An ARN and not a name, because the same value is the IAM policy's Resource
  # and a bare name there is not a valid ARN. The pattern enforces it at
  # changeset time rather than letting the role creation fail halfway through.
  # -----------------------------------------------------------------------

  JwtAccessSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:[a-z0-9-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    Description: >-
      ARN of an existing Secrets Manager secret holding the HS256 access-token
      signing secret. Empty (the default) generates one inside the stack. The
      function reads it at cold start; the value never enters the template.
      Append #<jsonKey> to select one key of a JSON secret document — point
      this and JwtRefreshSecretArn at the same ARN with two different keys and
      your stack gets the same one-fetch cold start the default path has.

  JwtRefreshSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:[a-z0-9-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    Description: >-
      ARN of an existing Secrets Manager secret holding the refresh-token
      signing secret. Empty generates one. RS-1 requires it to differ from the
      access secret. Also accepts a #<jsonKey> selector.

  TableNamePrefix:
    Type: String
    Default: awesome-auth
    AllowedPattern: '^[A-Za-z0-9_.-]{1,80}$'
    Description: Table is named <prefix>-<stack name>.

  MaxReadRequestUnits:
    Type: Number
    Default: 200
    MinValue: 1
    Description: >-
      On-demand read ceiling (data-model.md §6.1). A credential-stuffing run is
      a DynamoDB bill before it is an outage, so the ceiling is set rather than
      left unbounded. Raise it deliberately.

  MaxWriteRequestUnits:
    Type: Number
    Default: 200
    MinValue: 1
    Description: On-demand write ceiling (data-model.md §6.1).

  EnableDeletionProtection:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      data-model.md §6.1 wants this on. It defaults to off here so the
      quickstart can be torn down in one command; turn it on for anything
      holding real users, and note that scripts/teardown.sh then needs
      --disable-deletion-protection.

  MemorySize:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 10240
    Description: >-
      Login is CPU-bound on bcrypt (cost 12). Lambda bills GB-ms, so 1024
      roughly halves login latency at about the same cost per request — worth
      it if p99 matters to you.

  Timeout:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 29
    Description: >-
      Seconds. Not the 15-minute default: nothing in the auth router should
      take longer than an API Gateway integration is willing to wait (29s).

  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
    Description: CloudWatch Logs retention. Never-expire is a slow-growing bill.

  SessionCheckOn:
    Type: String
    Default: refresh
    AllowedValues: [allcalls, refresh, none]
    Description: >-
      AWESOME_AUTH_SESSIONS_CHECK_ON. "allcalls" costs one strongly-consistent
      GetItem on every authenticated request and buys immediate revocation.

Conditions:
  IsDefaultStage: !Equals [!Ref StageName, '$default']
  GenerateJwtAccessSecret: !Equals [!Ref JwtAccessSecretArn, '']
  GenerateJwtRefreshSecret: !Equals [!Ref JwtRefreshSecretArn, '']
  # One generated secret serves whichever knobs were left empty, so supplying
  # only one of the two ARNs still works and still generates only what is
  # missing.
  GenerateSigningSecrets: !Or [!Condition GenerateJwtAccessSecret, !Condition GenerateJwtRefreshSecret]
  HasPublicUrl: !Not [!Equals [!Ref PublicUrl, '']]
  HasAllowedOrigins: !Not [!Equals [!Ref AllowedOrigins, '']]
  HasCookieDomain: !Not [!Equals [!Ref CookieDomain, '']]
  # A named stage on the raw execute-api URL puts /<stage> in front of every
  # path the browser sees, so the Path-scoped refresh cookie has to match.
  NeedsStagePrefixedCookiePath: !And
    - !Not [!Condition IsDefaultStage]
    - !Not [!Condition HasPublicUrl]

Resources:

  # ---------------------------------------------------------------------
  # Signing secrets
  #
  # Generated by Secrets Manager, never authored by a human, never a template
  # parameter, never in a CLI history. Created only when at least one of the
  # *SecretArn parameters is empty, which is the default; supply both ARNs and
  # the stack references yours instead and creates nothing.
  #
  # The function receives the ARN, not the value, and fetches the value itself
  # at cold start through internal/integration/aws (Secrets Manager -> SSM
  # SecureString -> environment variable, config-schema.md §1,
  # internal/config/secret.go resolveOne). One fetch per *secret* per execution
  # environment, cached for its life — never per request.
  #
  # This template used to do the opposite: '{{resolve:secretsmanager:...}}'
  # substitutes the VALUE into the environment at deploy time, and
  # `aws lambda get-function-configuration` then hands the HS256 key to anyone
  # holding lambda:GetFunction, who can mint a token for any user id. That is
  # why the substitution is gone from AuthFunction.Environment and why nothing
  # there may reintroduce it. The one use of the dynamic reference that remains
  # is inside JwtSigningSecrets below, secret-to-secret, where the resolved
  # value goes to Secrets Manager and nowhere a reader can follow — see the
  # note on it.
  #
  # No explicit Name: CloudFormation's deletion of a secret is a scheduled
  # deletion with a recovery window, and a fixed name would then block
  # re-creating the same stack for up to 30 days.
  #
  # ---- why two resources for one secret ------------------------------------
  #
  # The function must make ONE GetSecretValue on the init path, so both keys
  # have to live in one secret. GenerateSecretString populates exactly one key:
  # GenerateStringKey names it, and SecretStringTemplate supplies the rest of
  # the document as literal text. There is no second generator.
  #
  # So the second random value is generated by a second secret whose only job
  # is to hold it, and inlined into the first one's template with a
  # secret-to-secret dynamic reference. The two values are independent 64-char
  # strings drawn by AWS; neither is a function of the other. Deriving one from
  # the other — HMAC, hash, a suffix — was rejected: two keys that are a pure
  # function of each other are one key wearing two names, and RS-1's "must
  # differ" would be satisfied in letter only.
  #
  # What this costs, stated plainly:
  #   * Two Secrets Manager secrets are still billed, so cost at rest does not
  #     improve — only cold start does.
  #   * The refresh key exists in two places. JwtRefreshSecretSeed is NOT in
  #     the function's IAM policy and NOT in its environment, so the runtime
  #     blast radius is unchanged; the extra copy matters only to a principal
  #     with account-wide Secrets Manager read, who could read the real one
  #     anyway. Rotation (infra/sam/README.md) writes JwtSigningSecrets and
  #     leaves the seed stale, which is correct: after stack creation the seed
  #     is never read by anything at runtime.
  #   * The seed cannot be deleted by hand. CloudFormation re-resolves the
  #     dynamic reference whenever it builds a changeset for this stack, and a
  #     missing seed fails the changeset.
  #
  # Verified on a real deployment before it was written down: the resolved
  # value appears in neither template stage (Original or Processed) of
  # `cloudformation get-template`, nor in `describe-stack-events`.
  # ---------------------------------------------------------------------

  JwtRefreshSecretSeed:
    Type: AWS::SecretsManager::Secret
    Condition: GenerateSigningSecrets
    Properties:
      Description: !Sub 'Generated material for the refreshTokenSecret key of ${AWS::StackName} signing secrets — not read at runtime'
      GenerateSecretString:
        # ExcludePunctuation is load-bearing twice over here: it keeps the
        # value out of trouble in a JSON document (no quote or backslash to
        # escape) when it is inlined into JwtSigningSecrets below, and it is
        # what the previous bare-string secrets used. 64 characters of
        # alphanumeric against the 32 RS-1 requires.
        PasswordLength: 64
        ExcludePunctuation: true

  JwtSigningSecrets:
    Type: AWS::SecretsManager::Secret
    Condition: GenerateSigningSecrets
    Properties:
      Description: !Sub 'HS256 access- and refresh-token signing secrets for ${AWS::StackName} (two keys, one secret — RS-1 requires them to differ)'
      GenerateSecretString:
        # accessTokenSecret is drawn here. refreshTokenSecret is drawn by
        # JwtRefreshSecretSeed and copied in — the '${JwtRefreshSecretSeed}'
        # substitution is also what orders the two resources, so no DependsOn.
        #
        # The key names match the config paths they feed
        # (security.jwt.accessTokenSecret / .refreshTokenSecret), which is the
        # same convention the resolver's doc comment uses.
        SecretStringTemplate: !Sub '{"refreshTokenSecret":"{{resolve:secretsmanager:${JwtRefreshSecretSeed}}}"}'
        GenerateStringKey: accessTokenSecret
        PasswordLength: 64
        ExcludePunctuation: true

  # ---------------------------------------------------------------------
  # Single table — docs/spec/data-model.md §2
  #
  # PK/SK, one sparse GSI. The four access patterns that need GSI1 are
  # ListSessionsForUser (#15), DeleteRole's assignment sweep (#33),
  # GetTenantsForUser (#45) and LinkedAccountStore.ListForUser (#54); every
  # other lookup is served from the main table's key space on purpose (§2.3).
  #
  # The GSI projection is INCLUDE of exactly _t, linkId, createdAt, matching
  # gsi1Projection in internal/store/dynamodb/table.go. Not ALL, because that
  # would duplicate every session item — the highest-churn entity — and not
  # KEYS_ONLY, because ListForUser needs a link's id and creation time. Nothing
  # secret is projected: passwordHash, totpSecret, refreshHash and every
  # *Hash/*Exp attribute exist in exactly one physical copy (§5).
  # ---------------------------------------------------------------------

  AuthTable:
    Type: AWS::DynamoDB::Table
    # DeletionPolicy is left at the default (Delete) so the quickstart can be
    # torn down cleanly. For a stack holding real users, change both of these
    # to Retain — they take no intrinsic functions, so it is a hand edit.
    # PITR does give you 35 days to restore a table deleted by accident.
    Properties:
      TableName: !Sub '${TableNamePrefix}-${AWS::StackName}'
      BillingMode: PAY_PER_REQUEST
      OnDemandThroughput:
        MaxReadRequestUnits: !Ref MaxReadRequestUnits
        MaxWriteRequestUnits: !Ref MaxWriteRequestUnits
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
        - {AttributeName: GSI1PK, AttributeType: S}
        - {AttributeName: GSI1SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - {AttributeName: GSI1PK, KeyType: HASH}
            - {AttributeName: GSI1SK, KeyType: RANGE}
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes: [_t, linkId, createdAt]
          OnDemandThroughput:
            MaxReadRequestUnits: !Ref MaxReadRequestUnits
            MaxWriteRequestUnits: !Ref MaxWriteRequestUnits
      TimeToLiveSpecification:
        # §4.5. Sessions, refresh pointers, all four single-use token pointers,
        # pending OAuth links, telemetry and rate-limit counters carry `ttl`.
        # TTL is not a security boundary — deletion is best-effort within ~48h
        # and every read re-checks the expiry attribute in code.
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      StreamSpecification:
        # §6.1: enabled from day one because turning it on later gives no
        # history. Nothing consumes it yet, and an unconsumed stream costs
        # nothing at rest.
        StreamViewType: NEW_AND_OLD_IMAGES
      SSESpecification:
        # AWS-owned key. §6.1 recommends a customer-managed CMK for production;
        # it is left out of the quickstart because it adds a monthly key charge
        # and a real operational obligation (deleting the key destroys the data
        # irrecoverably, and PITR restore and S3 export both need kms:Decrypt).
        SSEEnabled: false
      DeletionProtectionEnabled: !Ref EnableDeletionProtection

  # ---------------------------------------------------------------------
  # HTTP API — payload format 2.0, not REST
  #
  # No CorsConfiguration here on purpose: the auth router applies CORS from
  # http.cors.origins, and configuring it in two places is how you end up with
  # duplicate Access-Control-Allow-Origin headers and a browser that rejects
  # both.
  # ---------------------------------------------------------------------

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      # The default stage is created automatically; don't also auto-deploy a
      # second one.
      FailOnWarnings: true

  AuthLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-auth'
      RetentionInDays: !Ref LogRetentionDays

  AuthFunction:
    Type: AWS::Serverless::Function
    DependsOn: AuthLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-auth'
      Description: !Sub 'awesome-lambda-auth router for ${AWS::StackName}'
      # Built by scripts/build-lambda.sh. `aws cloudformation package` rewrites
      # this to an S3 URI; the path is relative to this template.
      CodeUri: ../../dist/auth-lambda.zip
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures: [arm64]
      MemorySize: !Ref MemorySize
      Timeout: !Ref Timeout
      Environment:
        Variables:
          # --- deployment ------------------------------------------------
          AWESOME_AUTH_DEPLOYMENT_ENVIRONMENT: !Ref DeploymentEnvironment
          # Empty for a $default stage: the API is served at the root and there
          # is no stage segment for lambdahttp to strip.
          AWESOME_AUTH_DEPLOYMENT_STAGE: !If [IsDefaultStage, '', !Ref StageName]
          # Set only when the operator supplies one. It CANNOT be defaulted to
          # this stack's own execute-api URL, and the attempt is a circular
          # dependency, not a style preference:
          #
          #   AuthFunction.Environment -> !Ref HttpApi   (to build the URL)
          #   HttpApi.DefinitionBody   -> AuthFunction.Arn
          #     (SAM generates the OpenAPI body from the function's events, and
          #      every x-amazon-apigateway-integration uri names the function)
          #
          # CloudFormation rejects the changeset outright with
          #   Circular dependency between resources:
          #   [HttpApiStage, AuthFunctionRootPermission, HttpApi, AuthFunction,
          #    AuthFunctionProxyPermission]
          #
          # Nothing is lost. deployment.publicUrl has exactly one consumer,
          # refuse-to-start rule RS-2 (internal/config/rules.go
          # checkRS2InsecureCookieMode), which asks whether the origin is a
          # custom domain or a shared AWS one. On a raw execute-api URL the
          # answer is "shared", so the only way to pass RS-2 there is
          # AllowInsecureCookieMode=true, which short-circuits the rule before
          # it ever reads this value. The deployment where the value decides
          # anything is the custom-domain one — and that deployment sets
          # PublicUrl by definition. The endpoint is still reported, in the
          # ApiEndpoint output; an output may reference HttpApi freely because
          # outputs are resolved after every resource exists.
          AWESOME_AUTH_DEPLOYMENT_PUBLIC_URL: !If [HasPublicUrl, !Ref PublicUrl, !Ref 'AWS::NoValue']

          # --- store -----------------------------------------------------
          AWESOME_AUTH_STORES_DRIVER: dynamodb
          AWESOME_AUTH_STORES_CONNECTION_TABLE_NAME: !Ref AuthTable

          # --- http ------------------------------------------------------
          AWESOME_AUTH_HTTP_API_PREFIX: !Ref ApiPrefix
          AWESOME_AUTH_CORS_ORIGINS: !If [HasAllowedOrigins, !Ref AllowedOrigins, !Ref 'AWS::NoValue']

          # --- cookies and CSRF ------------------------------------------
          # Secure is unconditionally true: API Gateway only ever serves HTTPS.
          AWESOME_AUTH_COOKIES_SECURE: 'true'
          AWESOME_AUTH_COOKIES_SAMESITE: !Ref CookieSameSite
          AWESOME_AUTH_COOKIES_DOMAIN: !If [HasCookieDomain, !Ref CookieDomain, !Ref 'AWS::NoValue']
          AWESOME_AUTH_COOKIES_REFRESH_PATH: !If
            - NeedsStagePrefixedCookiePath
            - !Sub '/${StageName}${ApiPrefix}/refresh'
            - !Ref 'AWS::NoValue'
          AWESOME_AUTH_COOKIES_ALLOW_INSECURE_COOKIE_MODE: !Ref AllowInsecureCookieMode
          # RS-3: cookie delivery without a double-submit token is cross-site
          # forgeable. Left explicit so a reader sees it is on.
          AWESOME_AUTH_CSRF_ENABLED: 'true'

          # --- sessions --------------------------------------------------
          AWESOME_AUTH_SESSIONS_CHECK_ON: !Ref SessionCheckOn

          # --- signing secrets -------------------------------------------
          # REFERENCES, not values. The _SECRETSMANAGER suffix on a secret
          # knob's documented variable means "this names a Secrets Manager
          # secret" (internal/config/secret.go, SecretsManagerEnvSuffix); the
          # function fetches the value itself at cold start.
          #
          # Everything readable here is an ARN. Anyone with lambda:GetFunction
          # learns where the key lives, which they could learn from the stack
          # anyway, and still cannot sign a token. Reading the key itself needs
          # secretsmanager:GetSecretValue on that exact ARN.
          #
          # Do not add AWESOME_AUTH_JWT_ACCESS_SECRET (no suffix) alongside
          # these. It is the plaintext form, it is development-only, and it is
          # last in the resolution order — so it would not even take effect,
          # while still publishing the secret.
          #
          # By default both point at the SAME secret ARN with different
          # '#<jsonKey>' selectors. That is the whole cold-start change: the
          # resolver caches per secret id with the selector stripped
          # (internal/integration/aws/secrets.go splitSecretRef, secretCache),
          # so the second knob is served from the first knob's fetch and init
          # makes one GetSecretValue instead of two. Bring your own ARN and
          # that knob points at yours; the selector is optional there too.
          AWESOME_AUTH_JWT_ACCESS_SECRET_SECRETSMANAGER: !If
            - GenerateJwtAccessSecret
            - !Sub '${JwtSigningSecrets}#accessTokenSecret'
            - !Ref JwtAccessSecretArn
          AWESOME_AUTH_JWT_REFRESH_SECRET_SECRETSMANAGER: !If
            - GenerateJwtRefreshSecret
            - !Sub '${JwtSigningSecrets}#refreshTokenSecret'
            - !Ref JwtRefreshSecretArn

      Policies:
        # -----------------------------------------------------------------
        # Exactly the calls the store makes, and nothing else. The list is the
        # API interface in internal/store/dynamodb/store.go, cross-checked
        # against the call sites: GetItem, PutItem, UpdateItem, DeleteItem,
        # Query, TransactWriteItems, BatchGetItem, BatchWriteItem.
        #
        #   * TransactWriteItems has no IAM action of its own — it is
        #     authorised by the per-item actions of the operations inside it.
        #   * No ConditionCheckItem. Nothing in the P1 subset puts a bare
        #     ConditionCheck into a transaction; a Put or Update carrying a
        #     ConditionExpression is authorised by PutItem/UpdateItem. It goes
        #     back in with the RBAC and tenant stores, which do use one
        #     (data-model.md #29 and #43). Granting it early would make the
        #     first line of this comment false, which is the whole point.
        #   * No Scan: the store never scans. No DescribeTable: New() performs
        #     no I/O, deliberately, so a cold start does not pay for one.
        #   * No CreateTable/UpdateTimeToLive: the helper in table.go exists for
        #     DynamoDB Local and throwaway tables. Production tables come from
        #     this template.
        #   * Index ARNs only accept read actions, and the store only ever
        #     Queries GSI1.
        #
        # If you copy one thing out of this template, copy this. A wildcard
        # resource in an auth service's execution role is a bad example that
        # propagates.
        # -----------------------------------------------------------------
        - Version: '2012-10-17'
          Statement:
            - Sid: AuthTableItems
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:BatchGetItem
                - dynamodb:BatchWriteItem
              Resource: !GetAtt AuthTable.Arn
            - Sid: AuthTableIndexQuery
              Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !Sub '${AuthTable.Arn}/index/GSI1'

        # -----------------------------------------------------------------
        # The signing secrets the function actually reads, by ARN, and nothing
        # else. One action, no wildcard — not even the ':*' suffix AWS
        # documentation habitually appends, because a full ARN including the
        # six-character suffix Secrets Manager generates is an exact match and
        # a wildcard would also match every future secret whose name shares the
        # prefix.
        #
        # On the default path that is ONE resource: both knobs read two keys of
        # JwtSigningSecrets. JwtRefreshSecretSeed is deliberately absent — it is
        # consumed by CloudFormation at stack-create time and never by the
        # function, so granting the role a read on it would widen the runtime
        # blast radius for nothing.
        #
        # !Select/!Split strips an optional '#<jsonKey>' selector from a
        # supplied ARN: the resolver understands the suffix, IAM does not, and
        # a Resource with a '#' in it silently matches nothing. The generated
        # ARNs are listed without a selector for the same reason.
        #
        # No kms:Decrypt: these secrets use the AWS-managed aws/secretsmanager
        # key, which needs no grant on the caller. A customer-managed key does
        # — add kms:Decrypt on that key's ARN, scoped with a
        # kms:ViaService condition.
        #
        # No ssm:GetParameter either. The SSM resolver is wired in the binary
        # and this stack does not use it; granting a permission nothing calls
        # would make the DynamoDB comment above a lie. If you point a knob at a
        # SecureString with AWESOME_AUTH_<KNOB>_SSM_PARAMETER, add:
        #
        #   - Effect: Allow
        #     Action: [ssm:GetParameter]
        #     Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/your/parameter'
        #
        # plus kms:Decrypt on the key it was encrypted with, unless that is the
        # AWS-managed aws/ssm key.
        # -----------------------------------------------------------------
        - Version: '2012-10-17'
          Statement:
            - Sid: ReadSigningSecrets
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !If [GenerateSigningSecrets, !Ref JwtSigningSecrets, !Ref 'AWS::NoValue']
                - !If [GenerateJwtAccessSecret, !Ref 'AWS::NoValue', !Select [0, !Split ['#', !Ref JwtAccessSecretArn]]]
                - !If [GenerateJwtRefreshSecret, !Ref 'AWS::NoValue', !Select [0, !Split ['#', !Ref JwtRefreshSecretArn]]]

      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
            PayloadFormatVersion: '2.0'
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
            PayloadFormatVersion: '2.0'

Outputs:

  ApiEndpoint:
    Description: Base URL of the auth service. Routes live under <endpoint><ApiPrefix>.
    Value: !If
      - IsDefaultStage
      - !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
      - !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}'
    Export:
      Name: !Sub '${AWS::StackName}-ApiEndpoint'

  TableName:
    Description: DynamoDB single table backing every store.
    Value: !Ref AuthTable
    Export:
      Name: !Sub '${AWS::StackName}-TableName'

  FunctionName:
    Description: Lambda function running the auth router.
    Value: !Ref AuthFunction
    Export:
      Name: !Sub '${AWS::StackName}-FunctionName'
